site_name: every-class
site_description: UML class diagrams generated from XSD schemas

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.sections

plugins:
  - gen-files:
      scripts:
        - gen_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - plantuml:
      puml_url: http://127.0.0.1:8080/
      verbose: true
  - search

markdown_extensions:
  - pymdownx.superfences
