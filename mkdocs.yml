site_name: every-class
site_description: UML class diagrams generated from XSD schemas
repo_url: https://github.com/muratkendir/every-class
repo_name: muratkendir/every-class

theme:
  name: material
  logo: images/logo.png
  favicon: images/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.sections

plugins:
  - gen-files:
      scripts:
        - gen_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - plantuml:
      puml_url: http://127.0.0.1:8080/
      verbose: true
  - search

markdown_extensions:
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/fullscreen.js
